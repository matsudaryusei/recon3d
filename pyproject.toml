[project]
name = "4bitcom-HandM"
version = "0.1.0"
description = "2次元画像を3DCGで再構築する"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=2.4.6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recon3d"]

[tool.pytest.ini_options]
testpaths = ["tests"]
